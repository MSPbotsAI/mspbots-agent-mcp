[project]
name = "mspbots-agent-mcp"
version = "0.1.0"
description = "MCP server for the MSPbots Agent Platform capabilities API (list connectors: name, installed, status)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
mspbots-agent-mcp = "mspbots_agent_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mspbots_agent_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
